<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>img-to-dxf — Lazer kesim</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Syne:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <div class="bg-grid" aria-hidden="true"></div>

  <header class="top">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <h1>img-to-dxf</h1>
    </div>
    <p class="tagline">Siluet görüntü → kapalı kesim yolları (DXF)</p>
  </header>

  <main class="layout">
    <section class="panel controls" aria-label="Dönüştürme ayarları">
      <form id="form">
        <label class="drop" id="drop">
          <input type="file" id="file" accept="image/png,image/jpeg,image/webp,image/bmp" required />
          <span class="drop-title">Görüntüyü buraya bırak</span>
          <span class="drop-sub">veya tıkla · PNG / JPG · dolu siluet</span>
          <span class="drop-name" id="file-name" hidden></span>
        </label>

        <div class="field">
          <label for="width_mm">Genişlik (mm)</label>
          <input type="number" id="width_mm" name="width_mm" value="100" min="1" max="2000" step="0.1" />
        </div>

        <div class="field-row">
          <div class="field">
            <label for="threshold">Threshold <span class="hint" id="th-label">auto</span></label>
            <input type="range" id="threshold" min="0" max="255" value="127" />
            <input type="hidden" id="threshold_mode" value="auto" />
          </div>
          <button type="button" class="ghost" id="th-auto" title="Otsu otomatik">Auto</button>
        </div>

        <div class="field">
          <label for="simplify">Sadeleştirme <span class="hint" id="sim-label">0.002</span></label>
          <input type="range" id="simplify" min="0" max="20" value="2" />
        </div>

        <div class="field">
          <label for="min_area">Min alan (mm²) <span class="hint" id="area-label">0.5</span></label>
          <input type="range" id="min_area" min="0" max="50" value="5" />
        </div>

        <div class="field">
          <label for="blur">Blur <span class="hint" id="blur-label">3</span></label>
          <input type="range" id="blur" min="0" max="11" step="2" value="3" />
        </div>

        <label class="check">
          <input type="checkbox" id="invert" />
          <span>Tersine çevir (açık şekil / koyu zemin)</span>
        </label>

        <div class="actions">
          <button type="submit" class="primary" id="convert-btn">Önizle</button>
          <a class="secondary" id="download-btn" aria-disabled="true">DXF indir</a>
        </div>

        <p class="status" id="status" role="status"></p>
      </form>
    </section>

    <section class="panel preview" aria-label="Önizleme">
      <div class="tabs" role="tablist">
        <button type="button" class="tab active" data-tab="svg" role="tab" aria-selected="true">Kesim yolu</button>
        <button type="button" class="tab" data-tab="png" role="tab" aria-selected="false">Kontur overlay</button>
        <button type="button" class="tab" data-tab="source" role="tab" aria-selected="false">Kaynak</button>
      </div>

      <div class="stage" id="stage">
        <div class="empty" id="empty">
          <p>Dönüştürme sonrası DXF önizlemesi burada görünür.</p>
        </div>
        <div class="view" id="view-svg" hidden></div>
        <img class="view" id="view-png" alt="Kontur önizlemesi" hidden />
        <img class="view" id="view-source" alt="Yüklenen görüntü" hidden />
      </div>

      <dl class="meta" id="meta" hidden>
        <div><dt>Boyut</dt><dd id="meta-size">—</dd></div>
        <div><dt>Kontur</dt><dd id="meta-count">—</dd></div>
        <div><dt>Piksel</dt><dd id="meta-px">—</dd></div>
      </dl>
    </section>
  </main>

  <footer class="foot">
    <span>Lazer kesim için kapalı LWPOLYLINE · birim mm · layer CUT</span>
  </footer>

  <script src="/static/app.js"></script>
</body>
</html>
