[project]
name = "img-to-dxf"
version = "0.1.0"
description = "Convert silhouette images to DXF for laser cutting"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "opencv-python-headless>=4.8",
    "numpy>=1.24",
    "ezdxf>=1.3",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",
]

[project.scripts]
img-to-dxf = "img_to_dxf.cli:main"
img-to-dxf-web = "img_to_dxf.web:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/img_to_dxf"]

[tool.hatch.build]
include = [
  "src/img_to_dxf/static/**",
]
